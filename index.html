<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会議コスト計算機</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #6b7280;
    --border: #d9dde3; --accent: #2563eb; --accent-bg: #eff4ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b2029; --text: #e7e9ee; --muted: #9aa3b2;
      --border: #2e3542; --accent: #7aa2ff; --accent-bg: #1f2a44;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.6;
  }
  main { max-width: 480px; margin: 0 auto; padding: 40px 16px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  p.lead { color: var(--muted); margin: 0 0 24px; font-size: .95rem; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px;
  }
  label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 6px; }
  .field { margin-bottom: 16px; }
  .input-wrap { display: flex; align-items: center; gap: 8px; }
  input {
    flex: 1; width: 100%; font-size: 1.1rem; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--text);
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .unit { color: var(--muted); min-width: 3.5em; }
  .result {
    margin-top: 8px; padding: 16px; border-radius: 10px;
    background: var(--accent-bg); text-align: center;
  }
  .result .label { font-size: .85rem; color: var(--muted); }
  .result .total {
    font-size: 2.2rem; font-weight: 700; color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .result .formula { font-size: .85rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>会議コスト計算機</h1>
  <p class="lead">参加人数・時間・1時間あたりの単価から、会議にかかる時間コストを計算します。</p>

  <div class="card">
    <div class="field">
      <label for="people">参加人数</label>
      <div class="input-wrap">
        <input id="people" type="number" inputmode="numeric" min="0" step="1" value="5">
        <span class="unit">人</span>
      </div>
    </div>
    <div class="field">
      <label for="hours">会議の時間</label>
      <div class="input-wrap">
        <input id="hours" type="number" inputmode="decimal" min="0" step="0.25" value="1">
        <span class="unit">時間</span>
      </div>
    </div>
    <div class="field">
      <label for="rate">1時間あたりの単価（1人）</label>
      <div class="input-wrap">
        <input id="rate" type="number" inputmode="numeric" min="0" step="100" value="3000">
        <span class="unit">円</span>
      </div>
    </div>

    <div class="result" aria-live="polite">
      <div class="label">合計コスト</div>
      <div class="total" id="total">—</div>
      <div class="formula" id="formula"></div>
    </div>
  </div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => n.toLocaleString("ja-JP", { maximumFractionDigits: 2 });

  function calc() {
    const people = parseFloat($("people").value);
    const hours = parseFloat($("hours").value);
    const rate = parseFloat($("rate").value);
    if ([people, hours, rate].some((v) => isNaN(v) || v < 0)) {
      $("total").textContent = "—";
      $("formula").textContent = "0以上の数値を入力してください";
      return;
    }
    const total = Math.round(people * hours * rate);
    $("total").textContent = "¥" + total.toLocaleString("ja-JP");
    $("formula").textContent = `${fmt(people)}人 × ${fmt(hours)}時間 × ${fmt(rate)}円`;
  }

  ["people", "hours", "rate"].forEach((id) => $(id).addEventListener("input", calc));
  calc();
</script>
</body>
</html>
